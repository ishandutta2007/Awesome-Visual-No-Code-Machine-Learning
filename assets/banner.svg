<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Embedded CSS Animation Styles -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6; fill-opacity: 0.7; }
        50% { r: 9; fill-opacity: 1; }
      }
      @keyframes textShimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #c084fc; }
        100% { stop-color: #38bdf8; }
      }

      .bg-grid {
        stroke: #334155;
        stroke-opacity: 0.2;
        stroke-width: 1;
      }
      .animated-bg-orb1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .animated-bg-orb2 {
        animation: pulseGlow 10s ease-in-out infinite 2s;
        transform-origin: 1000px 260px;
      }
      .float-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 12 8;
        animation: flowDash 15s linear infinite;
      }
      .pulsing-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .node-delay-1 { animation-delay: 0.7s; }
      .node-delay-2 { animation-delay: 1.4s; }
      .node-delay-3 { animation-delay: 2.1s; }
      
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Rectangle -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)" />

  <!-- Animated Ambient Orbs (Background Layer) -->
  <circle class="animated-bg-orb1" cx="200" cy="100" r="180" fill="#0284c7" opacity="0.25" filter="url(#glow-cyan)" />
  <circle class="animated-bg-orb2" cx="1000" cy="260" r="220" fill="#7c3aed" opacity="0.2" filter="url(#glow-purple)" />

  <!-- Grid Pattern (Background Detail) -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Neural/Visual Workflow Network Connections (Midground) -->
  <g stroke="url(#line-gradient)" stroke-width="2" fill="none">
    <path class="flow-path" d="M 100 290 Q 250 330 450 280 T 850 310 T 1100 270" />
    <path class="flow-path" d="M 50 80 Q 300 40 550 90 T 950 50 T 1150 90" />
  </g>

  <!-- Pulsing Nodes along flow -->
  <circle class="pulsing-node" cx="250" cy="315" fill="#38bdf8" />
  <circle class="pulsing-node node-delay-1" cx="450" cy="280" fill="#818cf8" />
  <circle class="pulsing-node node-delay-2" cx="850" cy="310" fill="#c084fc" />
  <circle class="pulsing-node node-delay-3" cx="950" cy="50" fill="#38bdf8" />

  <!-- Floating UI Feature Pills (Visual / Drag-and-Drop Vibe) -->
  <g class="float-card" transform="translate(0, 0)">
    <!-- Pill 1: AutoML -->
    <rect x="150" y="45" width="130" height="34" rx="17" fill="url(#card-gradient)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="215" y="67" text-anchor="middle" class="pill-text">⚡ AutoML</text>

    <!-- Pill 2: Drag & Drop -->
    <rect x="880" y="45" width="160" height="34" rx="17" fill="url(#card-gradient)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="960" y="67" text-anchor="middle" class="pill-text">🎛️ Drag &amp; Drop ML</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp & High Contrast, Safe from Obstruction) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="165" class="title-text" fill="url(#text-gradient)" filter="url(#glow-cyan)">
      Awesome Visual No-Code Machine Learning
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" class="subtitle-text">
      Curated SaaS Platforms, Visual Workflow Engines &amp; Open-Source AutoML Frameworks
    </text>

    <!-- Secondary Tagline -->
    <g transform="translate(600, 260)">
      <rect x="-220" y="-18" width="440" height="36" rx="18" fill="rgba(15, 23, 42, 0.6)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
        🚀 Democratizing Artificial Intelligence &amp; Predictive Analytics
      </text>
    </g>
  </g>
</svg>
